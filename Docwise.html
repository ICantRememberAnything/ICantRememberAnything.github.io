<style>
body {
  font-family: Arial, sans-serif;
  padding: 16px;
  max-width: 800px;
  margin: auto;
}

.question {
  margin-bottom: 24px;
}

.question p {
  font-size: 1.1rem;
  font-weight: bold;
  white-space: pre-line;
}

/* OPTION BLOCK */
.option {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px;
  margin: 10px 0;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 1rem;
  cursor: pointer;
}

/* Bigger radio */
.option input[type="radio"] {
  transform: scale(1.4);
}

/* Feedback colors */
.correct {
  background-color: #d6f5d6;
  border-color: #3aa63a;
  /* color: green; */
  font-weight: bold;
  border: 2px solid #2e7d32;
}

.wrong {
  background-color: #f8d7da;
  border-color: #d9534f;
  /* color: red; */
  font-weight: bold;
  border: 2px dashed #c62828;
}

/* Dark Mode */
body.dark {
  background-color: #121212;
  color: #e0e0e0;
}

body.dark .option {
  background-color: #1e1e1e;
  border-color: #444;
}

body.dark .correct {
  background-color: #234d23;
  border-color: #4caf50;
}

body.dark .wrong {
  background-color: #5a1e1e;
  border-color: #f44336;
}

body.dark button {
  background-color: #333;
  color: #fff;
  border: 1px solid #666;
}

/* Control Buttons */
.controls {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  margin-bottom: 20px;
}

.controls label {
  font-size: 1rem;
}

.controls input[type="number"] {
  width: 80px;
  font-size: 1rem;
  padding: 6px;
}

/* Keep bottom buttons visually separated */
.bottom-controls {
  margin-top: 30px;
  border-top: 1px solid #ddd;
  padding-top: 20px;
}

/* Buttons */
.controls button {
  font-size: 1rem;
  padding: 10px 14px;
  border-radius: 8px;
}

/* Jump-to-top button */
#topBtn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 12px 16px;
  font-size: 1rem;
  border-radius: 50%;
}

/* Buttons */
button {
  font-size: 1rem;
  padding: 12px 16px;
  margin: 12px 10px 12px 0;
  border-radius: 8px;
}

</style>
</head>

/* =========================
   LOGIC (DON'T TOUCH)
   ========================= */

let questions = [];

let wrongQuestions = {}; /* 08/08/26 */
let reviewWrongMode = false; /* 01/08/26 */

/* Shuffle array */
function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

/* Shuffle answers */
function shuffleOptions(q) {
  const paired = q.options.map((opt, i) => ({
    text: opt,
    correct: i === q.answer
  }));
  shuffleArray(paired);
  q.options = paired.map(p => p.text);
  q.answer = paired.findIndex(p => p.correct);
}

/* Render quiz */
function renderQuiz() {
  const quizDiv = document.getElementById("quiz");
  quizDiv.innerHTML = "";
  document.getElementById("score").innerText = "";

  questions.forEach((q, i) => {
    let html = `<div class="question"><p>${i+1}. ${q.q}</p>`;
    q.options.forEach((opt, j) => {
      html += `
        <label class="option" data-q="${i}" data-o="${j}">
          <input type="radio" name="q${i}" value="${j}" onchange="handleInstant(${i})">
          <span>${opt}</span>
        </label><br>
      `;
    });
    html += `</div>`;
    quizDiv.innerHTML += html;
  });
}

/* Submit */
function submitQuiz() {
  let score = 0;

  questions.forEach((q, i) => {
    const selected = document.querySelector(`input[name="q${i}"]:checked`);
    const labels = document.querySelectorAll(`label[data-q="${i}"]`);

    labels.forEach((label, j) => {
      if (j === q.answer) label.classList.add("correct");
      if (selected && j === +selected.value && j !== q.answer) {
        label.classList.add("wrong");
        // wrongQuestions.add(q.originalIndex); /* 01/08/26 */
        if (!wrongQuestions[q.chapterID]) {
            wrongQuestions[q.chapterID] = new Set();
        }

        wrongQuestions[q.chapterID].add(q.questionID);
      }
    });

    if (selected && +selected.value === q.answer) score++;

    document
      .querySelectorAll(`input[name="q${i}"]`)
      .forEach(r => r.disabled = true);
  });

  updateWrongQuestionList(); /* 01/08/26 */

  let correct_percentage = ((score / questions.length) * 100).toFixed(2);

  document.getElementById("score").innerText =
    `Score: ${score} / ${questions.length} (${correct_percentage}%)`;
}

/* Instant Feedback */
function handleInstant(qIndex) {
  if (!document.getElementById("instantToggle").checked) return;

  const q = questions[qIndex];
  const selected = document.querySelector(`input[name="q${qIndex}"]:checked`);
  const labels = document.querySelectorAll(`label[data-q="${qIndex}"]`);

  labels.forEach((label, j) => {
    if (j === q.answer) label.classList.add("correct");
    if (selected && j === +selected.value && j !== q.answer) {
      label.classList.add("wrong");
      if (!wrongQuestions[q.chapterID]) {
          wrongQuestions[q.chapterID] = new Set();
      }

      wrongQuestions[q.chapterID].add(q.questionID); /* 08/08/26 */
    }
  });

  
  updateWrongQuestionList(); /* 01/08/26 */

  // Lock this question
  document
    .querySelectorAll(`input[name="q${qIndex}"]`)
    .forEach(r => r.disabled = true);
}


/* Reset */
function resetQuiz() {
  const shuffleEnabled = document.getElementById("shuffleToggle").checked;
  const selectedChapter = document.getElementById("chapterSelect").value;

  let count = parseInt(document.getElementById("questionCount").value);
  let start = parseInt(document.getElementById("rangeStart").value);
  let end = parseInt(document.getElementById("rangeEnd").value);

  // Get chapter pool
  let pool = originalQuestions
      .filter(q => q.chapter === selectedChapter)
      .map(q => JSON.parse(JSON.stringify(q))); /* 01/08/26 */ // ver2 //

  if (pool.length === 0) {
    alert("No questions in this chapter.");
    return;
  }

  // Clamp range
  if (isNaN(start) || start < 1) start = 1;
  if (isNaN(end) || end > pool.length) end = pool.length;

  if (start > end) [start, end] = [end, start];

  // Apply range (convert to 0-based index)
  pool = pool.slice(start - 1, end);

  // Fix count
  if (isNaN(count) || count < 1) count = pool.length;
  if (count > pool.length) count = pool.length;

  // Deep copy
  // pool = JSON.parse(JSON.stringify(pool)); // ver 1 //
  
  pool = pool.map(q => JSON.parse(JSON.stringify(q))); /* 01/08/26 */

  // Shuffle questions if enabled
  if (shuffleEnabled) shuffleArray(pool);

  // Pick N
  questions = pool.slice(0, count);

  // Shuffle answers if enabled
  if (shuffleEnabled) {
    questions.forEach(shuffleOptions);
  }

  renderQuiz();
}


/* Question Subsets Selection */
function populateChapterSelect() {
  const select = document.getElementById("chapterSelect");
  select.innerHTML = "";

  const chapters = [...new Set(originalQuestions.map(q => q.chapter))];

  chapters.forEach(ch => {
    const opt = document.createElement("option");
    opt.value = ch;
    opt.textContent = ch;
    select.appendChild(opt);
  });

  updateChapterSize(); //
}

function selectAllInChapter() {
  const selectedChapter = document.getElementById("chapterSelect").value;

  let start = parseInt(document.getElementById("rangeStart").value);
  let end = parseInt(document.getElementById("rangeEnd").value);

  let pool = originalQuestions.filter(q => q.chapter === selectedChapter);

  if (isNaN(start) || start < 1) start = 1;
  if (isNaN(end) || end > pool.length) end = pool.length;

  if (start > end) [start, end] = [end, start];

  const rangeSize = end - start + 1;

  document.getElementById("questionCount").value = rangeSize;

  resetQuiz();
}

function updateChapterSize() {
  const selectedChapter = document.getElementById("chapterSelect").value;

  const size = originalQuestions.filter(
    q => q.chapter === selectedChapter
  ).length;

  document.getElementById("chapterSize").textContent =
    `(${size} questions)`;

  // Reset range to full chapter
  document.getElementById("rangeStart").value = 1;
  document.getElementById("rangeEnd").value = size;
}

/* Wrong Quesions Storing and Recalling*/
function updateWrongQuestionList(){

    const list =
        document.getElementById("wrongList");

    const selectedChapter =
        document.getElementById("chapterSelect").value;

    const currentQuestion =
        originalQuestions.find(
            q => q.chapter === selectedChapter
        );

    const chapterID = currentQuestion.chapterID;


    if (!wrongQuestions[chapterID] ||
        wrongQuestions[chapterID].size === 0){

        list.innerHTML="None";
        return;
    }


    list.innerHTML =
        [...wrongQuestions[chapterID]]
        .sort((a,b)=>a-b)
        .join(", ");

}

function reviewWrongQuestions(){

    const shuffleEnabled =
        document.getElementById("shuffleToggle").checked;

    const selectedChapter =
        document.getElementById("chapterSelect").value;
    
    const currentQuestion =
        originalQuestions.find(
            q => q.chapter === selectedChapter
        );
    
    const chapterID = currentQuestion.chapterID;


    if (!wrongQuestions[chapterID] ||
        wrongQuestions[chapterID].size === 0){

        alert("No wrong questions in this chapter.");
        return;
    }


    // Get only wrong questions
    let pool =
        originalQuestions
        .filter(q =>
            q.chapterID === chapterID &&
            wrongQuestions[chapterID]
            .has(q.questionID)
        )
        .map(q =>
            JSON.parse(JSON.stringify(q))
        );


    // Shuffle question order
    if (shuffleEnabled) {
        shuffleArray(pool);
    }


    // Shuffle answers
    if (shuffleEnabled) {
        pool.forEach(shuffleOptions);
    }


    questions = pool;
    // document.getElementById("questionCount").value = questions.length;

    renderQuiz();

}

function clearWrongQuestions(){

    wrongQuestions.clear();

    updateWrongQuestionList();

}

function chapterChanged(){

    updateChapterSize();

    updateWrongQuestionList();

}

/* Jump to Top */
function scrollToTop() {
  window.scrollTo({ top: 0, behavior: "smooth" });
}


/* Dark Mode */
document.getElementById("darkToggle").addEventListener("change", e => {
  document.body.classList.toggle("dark", e.target.checked);
});


/* Initial load */

originalQuestions.forEach((q, i) => {
    q.originalIndex = i;
});

populateChapterSelect();
resetQuiz();
</script>
